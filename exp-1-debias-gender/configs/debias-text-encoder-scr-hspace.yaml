proj_name: gender-debias-text-encoder-scr-hspace
train_text_encoder: True
train_unet: False
weight_loss_scr: 8               # weight for the SCR image loss (per-t MSE of ori vs finetune UNet mid_block / h-space)
weight_loss_face: 1
factor1: 0.2
uncertainty_threshold: 0.2
train_images_per_prompt_GPU: 12
train_GPU_batch_size: 3
val_images_per_prompt_GPU: 30
val_GPU_batch_size: 8
val_images_per_prompt_total: 60   # 8 GPU * 8 = 64 generated, keep exactly 60 per occupation
learning_rate: 5e-5
max_train_steps: 10000
